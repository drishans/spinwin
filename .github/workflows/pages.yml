# Publishes the frontend to GitHub Pages as a fully static demo.
#
# There is no backend on Pages, so /api/* 404s and the frontend drops into demo
# mode automatically (see server/frontend/demo.js). Costs nothing and stays up
# regardless of what happens to the Fly app — a permanent home for the blog link.

name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'server/frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once, but don't cancel one mid-flight either.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy frontend
        run: |
          mkdir -p _site
          cp -r server/frontend/. _site/
          # The admin dashboard needs the API and Basic Auth — it has no
          # business being served from a public static host.
          rm -f _site/admin.html _site/admin.js _site/admin.css
          # Serve files verbatim; skip Jekyll processing.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
